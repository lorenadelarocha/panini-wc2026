<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panini FIFA World Cup 2026 — Sticker Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #d42027;
    --gold: #f5b800;
    --green: #3db54a;
    --orange: #f47920;
    --blue: #1b3d8f;
    --purple: #7b3fa0;
    --bg: #f0ebe0;
    --surface: #fff9f0;
    --surface2: #e8e0d0;
    --border: #c8bfad;
    --text: #1a1a2e;
    --muted: #6b5e4e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8bfad' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--blue);
    background-image: linear-gradient(135deg, #1b3d8f 0%, #0d2460 60%, #1b3d8f 100%);
    padding: 24px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(27,61,143,0.4);
    border-bottom: 4px solid var(--red);
  }
  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  header h1 span { color: var(--gold); }
  .header-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #fff;
  }
  .stat-pill .num { color: var(--gold); font-size: 1rem; }

  /* PROGRESS BAR */
  .progress-wrap {
    background: rgba(0,0,0,0.2);
    padding: 8px 20px 10px;
    text-align: center;
  }
  .progress-bar-track {
    background: rgba(0,0,0,0.3);
    border-radius: 99px;
    height: 10px;
    overflow: hidden;
    max-width: 500px;
    margin: 4px auto 0;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--gold));
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
  }

  /* CONTROLS */
  .controls {
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 120px;
    z-index: 90;
    background: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8bfad' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    border-bottom: 2px solid var(--border);
  }
  .search-box {
    flex: 1;
    min-width: 160px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    font-weight: 500;
  }
  .search-box:focus { border-color: var(--blue); }
  .search-box::placeholder { color: var(--muted); }

  .filter-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .btn-reset {
    background: transparent;
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 16px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
    flex-wrap: wrap;
    font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
  }
  .dot-missing { background: var(--surface2); border: 2px solid var(--border); }
  .dot-owned { background: var(--green); }
  .dot-dupe { background: var(--orange); }
  .legend-tip { margin-left: auto; font-style: italic; font-weight: 400; }

  /* MAIN CONTENT */
  main { padding: 16px 20px 40px; }

  /* Accent left borders by confederation */
  .team-section[data-conf="UEFA"] { border-left: 4px solid var(--blue); }
  .team-section[data-conf="Africa"] { border-left: 4px solid var(--red); }
  .team-section[data-conf="CONMEBOL"] { border-left: 4px solid var(--green); }
  .team-section[data-conf="Asia"] { border-left: 4px solid var(--purple); }
  .team-section[data-conf="CONCACAF"] { border-left: 4px solid var(--orange); }
  .team-section[data-conf="Oceania"] { border-left: 4px solid #0ea5e9; }

  /* TEAM SECTION */
  .team-section {
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 3px 3px 0 var(--border);
  }
  .team-section.hidden { display: none; }

  .team-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
    border-bottom: 2px solid var(--border);
  }
  .team-header:hover { background: #ddd5c2; }
  .team-flag { font-size: 1.5rem; line-height: 1; }
  .team-name { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 1rem; flex: 1; color: var(--text); }
  .team-code { font-size: 0.7rem; color: var(--muted); font-family: monospace; font-weight: 700; background: var(--border); padding: 1px 5px; border-radius: 3px; }
  .team-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
  }
  .team-mini-bar {
    width: 60px;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .team-mini-fill {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    transition: width 0.3s;
  }
  .team-count { font-size: 0.75rem; color: var(--muted); min-width: 36px; text-align: right; font-weight: 700; }
  .team-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
  .team-section.collapsed .team-chevron { transform: rotate(-90deg); }
  .team-section.collapsed .team-header { border-bottom: none; }

  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 6px;
    padding: 12px;
  }
  .team-section.collapsed .sticker-grid { display: none; }

  /* STICKER CARD */
  .sticker {
    aspect-ratio: 2/3;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    border: 2px solid var(--border);
    position: relative;
    background: var(--surface2);
    user-select: none;
    padding: 4px;
    text-align: center;
    box-shadow: 2px 2px 0 var(--border);
  }
  .sticker:hover { transform: scale(1.06) rotate(-1deg); box-shadow: 4px 4px 0 var(--border); }
  .sticker:active { transform: scale(0.97); }

  .sticker.owned {
    background: #d4f5e0;
    border-color: var(--green);
    box-shadow: 2px 2px 0 var(--green);
  }
  .sticker.dupe {
    background: #fde8d2;
    border-color: var(--orange);
    box-shadow: 2px 2px 0 var(--orange);
  }
  .sticker.foil {
    background: linear-gradient(135deg, #fdf6d8, #fff9e6, #fcedb0);
    border-color: var(--gold);
    box-shadow: 2px 2px 0 #c9930a;
  }
  .sticker.foil.owned {
    background: linear-gradient(135deg, #d4f5e0, #e8faf0);
    border-color: var(--green);
    box-shadow: 2px 2px 0 var(--green);
  }
  .sticker.foil.dupe {
    background: linear-gradient(135deg, #fde8d2, #fff0e4);
    border-color: var(--orange);
    box-shadow: 2px 2px 0 var(--orange);
  }

  .sticker-num {
    font-size: 0.6rem;
    font-weight: 700;
    font-family: monospace;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .sticker.owned .sticker-num { color: #166534; }
  .sticker.dupe .sticker-num { color: #9a3412; }

  .sticker-icon { font-size: 1.2rem; margin: 2px 0; }
  .sticker-label {
    font-size: 0.5rem;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .sticker.owned .sticker-label { color: #166534; }
  .sticker.dupe .sticker-label { color: #9a3412; }

  .sticker-status {
    position: absolute;
    top: 2px;
    right: 3px;
    font-size: 0.6rem;
  }

  /* SPECIAL STICKERS (FWC intro section) */
  .special-section {
    background: var(--surface);
    border: 2px solid var(--gold);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 3px 3px 0 #c9930a;
  }
  .special-header {
    background: linear-gradient(90deg, #fff8d6, #fffcec);
    border-bottom: 2px solid var(--gold);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .special-header:hover { background: #fff3bb; }
  .special-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; color: #7c5a00; flex: 1; }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    display: none;
    font-weight: 600;
  }
  .no-results.show { display: block; }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    .controls { top: 108px; }
    .sticker-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 5px; }
  }

  /* CONFETTI animation for 100% */
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .celebrate { animation: pop 0.4s ease; }
</style>
</head>
<body>

<header>
  <h1>⚽ Panini FIFA <span>World Cup 2026™</span> Sticker Tracker</h1>
  <div class="header-stats">
    <div class="stat-pill">✅ Owned: <span class="num" id="totalOwned">0</span></div>
    <div class="stat-pill">❌ Missing: <span class="num" id="totalMissing">980</span></div>
    <div class="stat-pill">🔁 Duplicates: <span class="num" id="totalDupe">0</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span id="pct">0%</span> of 980 stickers collected</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="mainBar" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="controls">
  <input class="search-box" type="text" id="search" placeholder="🔍 Search team...">
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="missing">Missing</button>
    <button class="filter-btn" data-filter="complete">Complete ✅</button>
    <button class="filter-btn" data-filter="dupe">Has Dupes 🔁</button>
  </div>
  <button class="btn-reset" id="btnReset" title="Reset all stickers">🗑 Reset</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot dot-missing"></div> Missing</div>
  <div class="legend-item"><div class="legend-dot dot-owned"></div> Owned (1 click)</div>
  <div class="legend-item"><div class="legend-dot dot-dupe"></div> Duplicate (2 clicks)</div>
  <div class="legend-tip">Click sticker to cycle: Missing → Owned → Duplicate → Missing</div>
</div>

<main id="main">
  <div class="no-results" id="noResults">No teams match your search 🤷</div>
</main>

// ─── DATA ────────────────────────────────────────────────────────────────────
const TOTAL = 980;

const SPECIAL = [

const TEAMS = [
  { code:'MEX', name:'Mexico',                  flag:'🇲🇽', conf:'CONCACAF' },

// Sticker structure per team: 1=logo(foil), 2-12=players, 13=team photo, 14-20=players
function getStickerMeta(n) {
  if (n === 1)  return { icon: '✨', label: 'Logo',  foil: true };
  if (n === 13) return { icon: '📸', label: 'Photo', foil: false };
  return { icon: '👤', label: `Player`, foil: false };
}

// ─── STATE ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'panini_wc2026';
let state = {}; // code -> 0 (missing) | 1 (owned) | 2 (dupe)

function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { state = {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function cycleSticker(code) {
  const cur = state[code] || 0;
  state[code] = (cur + 1) % 3;
  saveState();
  return state[code];
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function buildUI() {
  const main = document.getElementById('main');
  const noRes = document.getElementById('noResults');
  main.innerHTML = '';
  main.appendChild(noRes);

  // Special stickers section
  const specSection = buildSpecialSection();
  main.appendChild(specSection);

  // Team sections
  TEAMS.forEach(team => {
    const sec = buildTeamSection(team);
    main.appendChild(sec);
  });

  updateGlobalStats();
}

function buildSpecialSection() {
  const sec = document.createElement('div');
  sec.className = 'special-section team-section';
  sec.dataset.name = 'intro special museum';

  const header = document.createElement('div');
  header.className = 'special-header team-header';

  const ownedCount = SPECIAL.filter(s => (state[s.code] || 0) >= 1).length;
  const total = SPECIAL.length;

  header.innerHTML = `
    <div class="team-flag">🌟</div>
    <div class="team-name special-title">Intro & Special Stickers</div>
    <div class="team-progress">
      <div class="team-mini-bar"><div class="team-mini-fill" style="width:${ownedCount/total*100}%"></div></div>
      <div class="team-count">${ownedCount}/${total}</div>
    </div>
    <div class="team-chevron">▾</div>
  `;
  header.addEventListener('click', () => sec.classList.toggle('collapsed'));

  const grid = document.createElement('div');
  grid.className = 'sticker-grid';
  grid.id = 'grid-SPECIAL';

  SPECIAL.forEach(s => {
    grid.appendChild(buildStickerCard(s.code, s.icon, s.label, s.foil));
  });

  sec.appendChild(header);
  sec.appendChild(grid);
  return sec;
}

function buildTeamSection(team) {
  const sec = document.createElement('div');
  sec.className = 'team-section';
  sec.dataset.code = team.code;
  sec.dataset.conf = team.conf;
  sec.dataset.name = team.name.toLowerCase() + ' ' + team.code.toLowerCase();
  sec.id = 'section-' + team.code;

  const header = document.createElement('div');
  header.className = 'team-header';
  header.addEventListener('click', () => sec.classList.toggle('collapsed'));

  const grid = document.createElement('div');
  grid.className = 'sticker-grid';
  grid.id = 'grid-' + team.code;

  for (let n = 1; n <= 20; n++) {
    const code = team.code + n;
    const meta = getStickerMeta(n);
    grid.appendChild(buildStickerCard(code, meta.icon, meta.label + (n !== 1 && n !== 13 ? ' ' + n : ''), meta.foil));
  }

  sec.appendChild(header);
  sec.appendChild(grid);
  updateTeamHeader(team, header);
  return sec;
}

function buildStickerCard(code, icon, label, foil) {
  const card = document.createElement('div');
  card.className = 'sticker' + (foil ? ' foil' : '');
  card.dataset.code = code;
  card.title = code;

  const s = state[code] || 0;
  if (s === 1) card.classList.add('owned');
  if (s === 2) card.classList.add('dupe');

  card.innerHTML = `
    <div class="sticker-num">${code}</div>
    <div class="sticker-icon">${icon}</div>
    <div class="sticker-label">${label}</div>
    <div class="sticker-status">${s===1?'✅':s===2?'🔁':''}</div>
  `;

  card.addEventListener('click', () => {
    const newState = cycleSticker(code);
    card.classList.toggle('owned', newState === 1);
    card.classList.toggle('dupe', newState === 2);
    card.querySelector('.sticker-status').textContent = newState===1?'✅':newState===2?'🔁':'';
    updateSectionStats(code);
    updateGlobalStats();
  });

  return card;
}

function updateTeamHeader(team, header) {
  const stickers = Array.from({length:20}, (_,i) => team.code + (i+1));
  const owned = stickers.filter(c => (state[c]||0) >= 1).length;
  header.innerHTML = `
    <div class="team-flag">${team.flag}</div>
    <div class="team-name">${team.name}</div>
    <div class="team-code">${team.code}</div>
    <div class="team-progress">
      <div class="team-mini-bar"><div class="team-mini-fill" style="width:${owned/20*100}%"></div></div>
      <div class="team-count">${owned}/20</div>
    </div>
    <div class="team-chevron">▾</div>
  `;
}

function updateSectionStats(changedCode) {
  // Find which team this code belongs to
  const team = TEAMS.find(t => changedCode.startsWith(t.code));
  if (!team) {
    // Special sticker — update special section
    const sec = document.querySelector('.special-section');
    const fill = sec.querySelector('.team-mini-fill');
    const count = sec.querySelector('.team-count');
    const owned = SPECIAL.filter(s => (state[s.code]||0) >= 1).length;
    fill.style.width = (owned / SPECIAL.length * 100) + '%';
    count.textContent = owned + '/' + SPECIAL.length;
    return;
  }
  const sec = document.getElementById('section-' + team.code);
  if (!sec) return;
  const header = sec.querySelector('.team-header');
  updateTeamHeader(team, header);
  header.addEventListener('click', () => sec.classList.toggle('collapsed'));

  // Re-apply filter
  applyActiveFilter();
}

function updateGlobalStats() {
  let owned = 0, dupe = 0;
  Object.values(state).forEach(v => {
    if (v === 1) owned++;
    if (v === 2) { owned++; dupe++; }
  });
  const missing = TOTAL - owned;
  const pct = Math.round(owned / TOTAL * 100);
  document.getElementById('totalOwned').textContent = owned;
  document.getElementById('totalMissing').textContent = missing;
  document.getElementById('totalDupe').textContent = dupe;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('mainBar').style.width = pct + '%';
}

// ─── FILTERING ───────────────────────────────────────────────────────────────
let activeFilter = 'all';

function applyActiveFilter() {
  const query = document.getElementById('search').value.toLowerCase();
  let visibleCount = 0;

  document.querySelectorAll('.team-section').forEach(sec => {
    const nameAttr = (sec.dataset.name || '').toLowerCase();
    const code = sec.dataset.code;

    // Search match
    const matchSearch = !query || nameAttr.includes(query);

    // Status filter
    let matchFilter = true;
    if (code && activeFilter !== 'all') {
      const stickers = Array.from({length:20}, (_,i) => code+(i+1));
      const owned = stickers.filter(c => (state[c]||0) >= 1).length;
      const hasDupe = stickers.some(c => (state[c]||0) === 2);
      if (activeFilter === 'missing') matchFilter = owned < 20;
      if (activeFilter === 'complete') matchFilter = owned === 20;
      if (activeFilter === 'dupe') matchFilter = hasDupe;
    }

    const show = matchSearch && matchFilter;
    sec.classList.toggle('hidden', !show);
    if (show) visibleCount++;
  });

  document.getElementById('noResults').classList.toggle('show', visibleCount === 0);
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', applyActiveFilter);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyActiveFilter();
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('Reset ALL stickers? This cannot be undone.')) return;
  state = {};
  saveState();
  document.querySelectorAll('.sticker').forEach(card => {
    card.classList.remove('owned', 'dupe');
    card.querySelector('.sticker-status').textContent = '';
  });
  // Re-render team headers
  TEAMS.forEach(team => {
    const sec = document.getElementById('section-' + team.code);
    if (!sec) return;
    const header = sec.querySelector('.team-header');
    updateTeamHeader(team, header);
    header.addEventListener('click', () => sec.classList.toggle('collapsed'));
  });
  // Special
  const specSec = document.querySelector('.special-section');
  if (specSec) {
    const fill = specSec.querySelector('.team-mini-fill');
    const count = specSec.querySelector('.team-count');
    fill.style.width = '0%';
    count.textContent = '0/' + SPECIAL.length;
  }
  updateGlobalStats();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadState();
buildUI();
</script>
</body>
</html>
